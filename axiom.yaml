name: christiangeorgelucas/storage-tools
version: 0.2.0
language: python
description: "Files for Axiom apps on any S3-compatible object store — built for Neon Object Storage (per-branch buckets, path-style, SigV4), works with any SigV4 store. Bytes live in the bucket; the app keeps file metadata in its own rows and mints short-lived URLs only after its own access check. Four GENERIC templates (ADR-122), each bound per app as an Instance: PresignPut and PresignGet sign browser upload/download URLs (pure computation, no network call), HeadObject and DeleteObject make one signed request. BRING YOUR OWN SECRETS — every input carries a `connection` naming FIVE tenant secrets (endpoint, region, bucket, access key id, secret access key); the Instance pins those names in its input map AND declares the same names in its required_secrets, which is what makes the values deliverable. No node ever accepts a credential VALUE as input, ever lists the bucket, or echoes a secret in an error. Keys are opaque caller-owned strings (1-1024 UTF-8 bytes, no leading '/', no empty/'.'/'..' segments, no control characters). Failures are typed AxiomNodeErrors with stable codes: KEY_INVALID, EXPIRES_INVALID, MAX_BYTES_INVALID, CONTENT_LENGTH_INVALID, MAX_BYTES_REQUIRES_CONTENT_LENGTH, MAX_BYTES_EXCEEDED, CONTENT_TYPE_INVALID, DOWNLOAD_NAME_INVALID, SECRET_NAME_REQUIRED, SECRET_UNAVAILABLE, ENDPOINT_INVALID, REGION_INVALID, BUCKET_INVALID, STORAGE_FORBIDDEN, STORAGE_HTTP_<status>, STORAGE_UNAVAILABLE."
nodes:
    - name: PresignPut
      description: "GENERIC TEMPLATE (ADR-122) — bind its input via an Instance before use; not directly invocable. Mint a short-lived SigV4 presigned PUT URL (path-style <endpoint>/<bucket>/<key>) that lets a browser upload ONE object without holding a credential. content_type, when set, and content_length, when > 0, are SIGNED (as Content-Type and Content-Length), so the store refuses an upload with a different type or length — send `headers` exactly as returned. max_bytes is a ceiling on content_length (a presigned PUT can only pin an exact length, so a cap requires a declared content_length; otherwise MAX_BYTES_REQUIRES_CONTENT_LENGTH). Always set content_type: an unsigned type lets the uploader store active content (text/html). expires_s 1-604800, default 600. Pure signing: no network call, nothing stored, safe to repeat. Mint it only after your flow has checked the caller may write the parent row."
      input: PresignPutInput
      output: PresignPutResult
      kind: generic
      generic_ports: [input]
    - name: PresignGet
      description: "GENERIC TEMPLATE (ADR-122) — bind its input via an Instance before use; not directly invocable. Mint a short-lived SigV4 presigned GET URL (path-style) that downloads ONE object with a plain browser request. With download_name set, the signed URL asks the store to answer Content-Disposition attachment with that name (RFC 6266, UTF-8 safe). expires_s 1-604800, default 600. Pure signing: no network call, nothing stored. Mint it only after your flow has applied the parent row's read rule; never store the URL."
      input: PresignGetInput
      output: PresignGetResult
      kind: generic
      generic_ports: [input]
    - name: HeadObject
      description: "GENERIC TEMPLATE (ADR-122) — bind its input via an Instance before use; not directly invocable. Read one object's existence, size and Content-Type with a single signed HEAD request — e.g. to confirm an upload landed before recording it. A missing object is exists=false, not an error (on a store that answers 403 for a missing key to a credential without list permission, that surfaces as STORAGE_FORBIDDEN); a refused credential is STORAGE_FORBIDDEN; 5xx and transport failures are retried twice, then STORAGE_UNAVAILABLE. Read-only, safe to repeat."
      input: HeadObjectInput
      output: HeadObjectResult
      kind: generic
      generic_ports: [input]
    - name: DeleteObject
      description: "GENERIC TEMPLATE (ADR-122) — bind its input via an Instance before use; not directly invocable. Delete one object with a single signed DELETE request. Deleting a key that does not exist also returns ok=true (S3 semantics), so a redelivered delete is harmless. A refused credential is STORAGE_FORBIDDEN; 5xx and transport failures are retried twice, then STORAGE_UNAVAILABLE."
      input: DeleteObjectInput
      output: DeleteObjectResult
      kind: generic
      generic_ports: [input]
    - name: StreamPut
      description: "GENERIC TEMPLATE (ADR-122) — bind its input via an Instance before use; not directly invocable. A PIPELINE node: stream a file INTO it, frame by frame, and it carries the bytes to the store as they arrive (never the whole file in memory), hashing them on the way, then answers ONE frame {ok, error_code, error, bytes, sha256}. The destination is a presigned PUT URL that PresignPut minted after the app's own access check (frame 0's upload_url, content_type, size): it pins the key, type and exact length and the store verifies it, so StreamPut adds no authority — it refuses a URL outside the connection's endpoint and bucket (URL_INVALID) and a stream whose bytes do not add up to size (SIZE_MISMATCH). For files bigger than a browser should PUT in one request, or bytes a flow cannot carry; the platform's per-node stream ceiling (5 minutes) bounds one upload."
      input: StreamPutInput
      output: StreamPutResult
      type: pipeline
      kind: generic
      generic_ports: [input]
